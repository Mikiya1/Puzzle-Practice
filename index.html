<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>パズドラ パズル練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <h1><span class="logo-gem">◆</span> パズドラ練習</h1>
    <button id="btn-settings" class="btn-icon" title="設定">⚙</button>
  </header>

  <div id="settings-overlay" class="overlay hidden"></div>
  <div id="settings-panel" class="side-panel hidden">
    <div class="panel-header">
      <h2>設定</h2>
      <button id="btn-settings-close" class="btn-icon">✕</button>
    </div>
    <div class="panel-body">
      <div class="setting-section">
        <div class="setting-label">盤面サイズ</div>
        <div class="btn-group">
          <button class="size-btn active" data-cols="6" data-rows="5">6×5</button>
          <button class="size-btn" data-cols="7" data-rows="6">7×6</button>
          <button class="size-btn" data-cols="5" data-rows="4">5×4</button>
        </div>
      </div>
      <div class="setting-section">
        <div class="setting-label">制限時間（0で無制限）</div>
        <div class="time-input-row">
          <input type="number" id="time-limit-input" value="0" min="0" max="999" step="1">
          <span class="unit-label">秒</span>
        </div>
      </div>
    </div>
  </div>

  <main>
    <div class="status-bar">
      <div class="stat">
        <div class="stat-label">コンボ</div>
        <div class="stat-value" id="combo-count">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">手数</div>
        <div class="stat-value" id="move-count">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">時間</div>
        <div class="stat-value" id="timer-display">0.0</div>
        <div class="timer-bar-wrap"><div id="timer-bar" class="timer-bar"></div></div>
      </div>
    </div>

    <div id="board-wrapper">
      <canvas id="puzzle-board"></canvas>
    </div>

    <div class="controls-main">
      <button id="btn-reset" class="btn-ctrl">🔄 リセット</button>
      <button id="btn-undo" class="btn-ctrl">↩ 戻す</button>
      <button id="btn-replay" class="btn-ctrl">▶ 再生</button>
      <button id="btn-new-random" class="btn-ctrl btn-accent">✦ ランダム</button>
    </div>

    <div class="section-label">陣を選んで配置</div>
    <div class="jin-area">
      <div class="jin-row">
        <button class="jin-btn" data-jin="2">2色陣</button>
        <button class="jin-btn" data-jin="3">3色陣</button>
        <button class="jin-btn" data-jin="4">4色陣</button>
        <button class="jin-btn" data-jin="5">5色陣</button>
        <button class="jin-btn" data-jin="6">6色陣</button>
      </div>
      <div id="jin-color-picker" class="jin-color-picker hidden">
        <div class="jin-color-label">色を<span id="jin-need-count">3</span>色選択</div>
        <div id="jin-color-list" class="jin-color-list"></div>
        <button id="btn-jin-apply" class="btn-accent" style="width:100%;margin-top:8px">この色で配置</button>
      </div>
    </div>

    <div class="section-label">カスタム配置</div>
    <div class="custom-area">
      <button id="btn-mode-toggle" class="btn-ctrl btn-mode" data-mode="puzzle">✏ 編集モード切替</button>
      <div id="custom-palette" class="custom-palette hidden">
        <div class="palette-label">配置するドロップ：</div>
        <div id="palette-drops" class="palette-drops"></div>
        <div class="palette-hint">選んでボードをなぞると色が変わります</div>
      </div>
    </div>

    <div class="combo-detail">
      <div class="combo-detail-title">コンボ詳細</div>
      <div id="combo-list" class="combo-list"></div>
    </div>
  </main>

  <div id="replay-bar" class="replay-bar hidden">
    <button id="btn-rp-prev">◀</button>
    <button id="btn-rp-playpause">▶</button>
    <button id="btn-rp-next">▶▶</button>
    <span id="rp-step-label">0/0</span>
    <label class="trail-label">
      軌跡<input type="checkbox" id="rp-trail-check" checked>
    </label>
    <button id="btn-rp-close">✕ 終了</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
